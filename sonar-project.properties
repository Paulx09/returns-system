# =====================================================================
# SonarQube / SonarCloud Project Configuration
# Tai Loy Returns & Warranties Management System
# Quality Gate & Maintainability Governance (RNF-04)
# =====================================================================

# Project Identification Metadata
sonar.projectKey=tailoy-returns-system
sonar.projectName=Tai Loy Returns System
sonar.projectVersion=1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source Code Inclusions (Application Core, Frontend Assets & Route Definitions)
sonar.sources=app,resources/js,routes

# Strict Exclusions (Dependencies, Generated Artifacts, Databases & Test Suites)
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,database/**,tests/**,e2e/**,k6/**,postman/**

# Test Code Configuration
sonar.tests=tests,e2e

# Quality Report Integration (PHPUnit Coverage & Execution Logs)
sonar.php.coverage.reportPaths=storage/app/qa-reports/clover.xml
sonar.php.tests.reportPath=storage/app/qa-reports/phpunit-junit.xml

# Quality Gate Policies & Maintainability Standards
# - New Code Coverage >= 80%
# - Code Duplication < 3.0%
# - Maintainability Rating: A (Technical Debt Ratio <= 5%)
# - Reliability Rating: A (0 Blocker / Critical Bugs)
# - Security Rating: A (0 Vulnerabilities, 0 Security Hotspots Unreviewed)
sonar.qualitygate.wait=true
