name: CI - Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  laravel-ci:
    name: Laravel & Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prevent root Dockerfile (Railway Nixpacks Guard)
        run: |
          if [ -f "Dockerfile" ]; then
            echo "::error file=Dockerfile::A Dockerfile was detected in the root directory."
            echo "Railway automatically overrides Nixpacks with Docker when a root Dockerfile exists."
            echo "To prevent production outages, keep Docker files in docker/ (e.g., docker/Dockerfile.k6)."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=http://localhost|APP_URL=http://localhost:8000|g' .env
          php artisan key:generate
          touch database/database.sqlite
          chmod -R 777 storage bootstrap/cache database

      - name: Run PHPUnit Tests
        run: php artisan test --no-coverage

      - name: Run Frontend Component Tests (Vitest)
        run: npm test

      - name: Prepare Database for Integration & E2E
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: Start Laravel Server
        run: |
          php artisan serve --no-reload --port=8000 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done'

      - name: Run Postman/Newman API Tests
        run: npm run test:api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            storage/app/qa-reports/playwright-report/
            test-results/
          retention-days: 7

